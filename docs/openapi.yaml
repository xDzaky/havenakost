components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Success:
      description: Response sukses standar
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiSuccess" }
    Error:
      description: Response error standar
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiSuccess:
      type: object
      required: [success, message, data, meta]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: {}
        meta:
          oneOf:
            - type: object
            - type: "null"
    ApiError:
      type: object
      required: [success, message, errors]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        errors:
          oneOf:
            - type: object
            - type: array
            - type: "null"
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }
    GenderPolicy:
      type: string
      enum: [male, female, mixed]
    ListingStatus:
      type: string
      enum: [draft, pending, published, rejected, archived]
    RoomStatus:
      type: string
      enum: [available, occupied, unavailable]
    ListingCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        district: { type: string }
        latitude: { type: string }
        longitude: { type: string }
        genderPolicy: { $ref: "#/components/schemas/GenderPolicy" }
        priceMin: { type: integer }
        priceMax: { type: integer }
        contactPhone: { type: string }
        coverImageUrl: { type: string, nullable: true }
        ratingAvg: { type: number }
        reviewCount: { type: integer }
        roomCount: { type: integer }
        availableRoomCount: { type: integer }
        distanceMeters: { type: number }
    ListingCreate:
      type: object
      required:
        - name
        - description
        - address
        - province
        - city
        - district
        - latitude
        - longitude
        - gender_policy
        - price_min
        - price_max
        - contact_phone
      additionalProperties: false
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 5000 }
        address: { type: string }
        province: { type: string }
        city: { type: string }
        district: { type: string }
        subdistrict: { type: string }
        postal_code: { type: string, pattern: "^[0-9]{5}$" }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        gender_policy: { $ref: "#/components/schemas/GenderPolicy" }
        price_min: { type: integer, minimum: 0 }
        price_max: { type: integer, minimum: 0 }
        contact_phone: { type: string, pattern: "^62[0-9]{8,15}$" }
        facility_ids:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
